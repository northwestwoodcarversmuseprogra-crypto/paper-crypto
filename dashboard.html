<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Paper Crypto – Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg">
    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 flex justify-between items-center">
      <h1 class="text-xl font-bold">Paper Crypto</h1>
      <button id="logoutBtn" class="text-sm bg-blue-700 px-3 py-1 rounded">Logout</button>
    </div>

    <!-- Total Balance -->
    <div class="p-6 text-center border-b">
      <p class="text-gray-500 text-sm">Total Balance</p>
      <p id="totalBalance" class="text-4xl font-bold text-gray-800">$0.00</p>
      <p id="userEmail" class="text-xs text-gray-400 mt-1"></p>
    </div>

    <!-- Coin Balances -->
    <div class="p-4 space-y-3">
      <div id="coinList" class="space-y-3"></div>
    </div>

    <!-- Send Form -->
    <div class="p-4 border-t">
      <h2 class="font-semibold mb-3">Send Crypto</h2>
      <form id="sendForm" class="space-y-3">
        <input type="email" id="recipient" placeholder="Recipient email" required
               class="w-full px-4 py-3 border rounded-xl">
        <select id="coin" class="w-full px-4 py-3 border rounded-xl">
          <option value="BTC">BTC</option>
          <option value="ETH">ETH</option>
          <option value="SOL">SOL</option>
          <option value="USDT">USDT</option>
        </select>
        <input type="number" id="amount" placeholder="Amount" step="any" min="0" required
               class="w-full px-4 py-3 border rounded-xl">
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold">
          Send
        </button>
      </form>
      <div id="sendMessage" class="mt-2 text-sm hidden"></div>
    </div>

    <!-- Transactions -->
    <div class="p-4 border-t">
      <h2 class="font-semibold mb-3">Transaction History</h2>
      <div id="txList" class="space-y-2 text-sm"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBAn7HGVRDEk8PRMVghOn2SWHQfI_iGjzY",
      authDomain: "papercrypto-503bb.firebaseapp.com",
      projectId: "papercrypto-503bb",
      storageBucket: "papercrypto-503bb.firebasestorage.app",
      messagingSenderId: "48170258665",
      appId: "1:48170258665:web:d87aaaf8638eb896466078"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userData = null;
    let prices = { bitcoin: 0, ethereum: 0, solana: 0, tether: 1 };

    const coinMap = {
      BTC: 'bitcoin',
      ETH: 'ethereum',
      SOL: 'solana',
      USDT: 'tether'
    };

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      document.getElementById('userEmail').textContent = user.email;
      await loadUserData();
      await loadPrices();
      loadTransactions();
    });

    async function loadUserData() {
      const doc = await db.collection('users').doc(currentUser.uid).get();
      if (doc.exists) {
        userData = doc.data();
        renderBalances();
      }
    }

    async function loadPrices() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana,tether&vs_currencies=usd');
        const data = await res.json();
        prices = data;
        renderBalances();
      } catch (e) {
        console.error('Price fetch failed', e);
      }
    }

    function renderBalances() {
      if (!userData) return;
      const balances = userData.balances || {};
      let total = 0;
      let html = '';

      ['BTC', 'ETH', 'SOL', 'USDT'].forEach(coin => {
        const amount = balances[coin] || 0;
        const price = prices[coinMap[coin]]?.usd || 0;
        const value = amount * price;
        total += value;
        html += `
          <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
            <div>
              <p class="font-semibold">${coin}</p>
              <p class="text-xs text-gray-500">${amount.toFixed(6)}</p>
            </div>
            <div class="text-right">
              <p class="font-medium">$${value.toFixed(2)}</p>
              <p class="text-xs text-gray-500">$${price.toFixed(2)}</p>
            </div>
          </div>
        `;
      });

      document.getElementById('coinList').innerHTML = html;
      document.getElementById('totalBalance').textContent = `$${total.toFixed(2)}`;
    }

    document.getElementById('sendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const recipientEmail = document.getElementById('recipient').value.trim();
      const coin = document.getElementById('coin').value;
      const amount = parseFloat(document.getElementById('amount').value);

      if (amount <= 0) return showSendMsg('Amount must be greater than 0', true);
      if (recipientEmail === currentUser.email) return showSendMsg('You cannot send to yourself', true);

      const myBalance = userData.balances?.[coin] || 0;
      if (amount > myBalance) return showSendMsg('Insufficient balance', true);

      try {
        // Find recipient
        const q = await db.collection('users').where('email', '==', recipientEmail).get();
        if (q.empty) return showSendMsg('User not found', true);
        const recipient = q.docs[0];

        // Deduct from sender immediately
        await db.collection('users').doc(currentUser.uid).update({
          [`balances.${coin}`]: firebase.firestore.FieldValue.increment(-amount)
        });

        // Create pending transaction
        await db.collection('transactions').add({
          fromUid: currentUser.uid,
          fromEmail: currentUser.email,
          toUid: recipient.id,
          toEmail: recipientEmail,
          coin: coin,
          amount: amount,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showSendMsg('Sent! Waiting for admin approval.', false);
        document.getElementById('sendForm').reset();
        await loadUserData();
        loadTransactions();
      } catch (err) {
        showSendMsg(err.message, true);
      }
    });

    function showSendMsg(text, isError) {
      const el = document.getElementById('sendMessage');
      el.textContent = text;
      el.className = `mt-2 text-sm ${isError ? 'text-red-600' : 'text-green-600'}`;
      el.classList.remove('hidden');
    }

    function loadTransactions() {
      db.collection('transactions')
        .where('fromUid', '==', currentUser.uid)
        .orderBy('createdAt', 'desc')
        .limit(20)
        .onSnapshot(snap => {
          let html = '';
          snap.forEach(doc => {
            const tx = doc.data();
            const statusColor = tx.status === 'pending' ? 'text-yellow-600' : tx.status === 'approved' ? 'text-green-600' : 'text-red-600';
            html += `
              <div class="bg-gray-50 p-3 rounded-xl flex justify-between">
                <div>
                  <p>Sent ${tx.amount} ${tx.coin} to ${tx.toEmail}</p>
                  <p class="text-xs text-gray-500">${tx.status}</p>
                </div>
                <span class="${statusColor} font-medium capitalize">${tx.status}</span>
              </div>
            `;
          });
          document.getElementById('txList').innerHTML = html || '<p class="text-gray-400">No transactions yet</p>';
        });
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => window.location.href = 'index.html');
    });
  </script>
</body>
</html>
